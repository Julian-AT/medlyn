[project]
name = "medlyn-ml"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "faker>=40.44.0",
    "mlx-lm>=0.32.2",
    "numpy>=2.5.4",
    "orjson>=3.13.0",
    "pillow>=13.0.0",
    "pyarrow>=26.0.0",
    "pymupdf>=2.0",
    "reportlab>=5.1.0",
    "tqdm>=4.70.1",
]

[tool.ruff]
line-length = 100

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
